version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: seqa-postgres
    environment:
      POSTGRES_DB: seqa
      POSTGRES_USER: seqa
      POSTGRES_PASSWORD: seqa_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U seqa']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: seqa-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
